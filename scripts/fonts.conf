<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- پیکربندی فونت محلی پروژه — فونت وزیرمتن را برای LibreOffice/fontconfig در دسترس می‌گذارد
     استفاده: FONTCONFIG_FILE=/home/z/my-project/scripts/fonts.conf <command> -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/conf.d</include>
  <dir>/home/z/my-project/assets/fonts</dir>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <cachedir>/home/z/my-project/assets/fontcache</cachedir>
</fontconfig>
