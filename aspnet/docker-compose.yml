# ============================================================
# docker-compose استقرار کامل: وب + SQL Server 2022 (فاز ۱۹)
# اجرا:  docker compose -f aspnet/docker-compose.yml up -d
# وب روی http://localhost:3000 — SQL Server روی 1433
# ============================================================
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
      MSSQL_MEMORY_LIMIT_MB: 1024
    volumes:
      - mssql-data:/var/opt/mssql
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -C -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      Database__Provider: SqlServer
      ConnectionStrings__SqlServer: "Server=db;Database=HrAttendance;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=true"
      Security__EnableHsts: "false"   # پشت TLS ترمینیت‌شده true کنید
      Security__AllowEmbedding: "false"
    volumes:
      - hr-logs:/app/logs
      - hr-backups:/app/backups
    ports:
      - "3000:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mssql-data:
  hr-logs:
  hr-backups:
